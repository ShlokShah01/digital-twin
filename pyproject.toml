[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin"
version = "0.1.0"
description = "AI Digital Twin of a Person - LLM + RAG + GraphRAG + Laya decision model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "laya>=0.3.20",
    "fastembed>=0.5",
    "lancedb>=0.18",
    "networkx>=3.2",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
serve = ["uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
digital-twin = "digital_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"